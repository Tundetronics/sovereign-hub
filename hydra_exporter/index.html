 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra Factory OS - Sovereign Hub</title>
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #fff; min-height: 100vh;
        }
        .container { max-width: 900px; margin: 50px auto; text-align: center; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px;
            padding: 30px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        input[type="text"] {
            width: 70%; padding: 12px; border-radius: 8px; border: none;
            background: rgba(255,255,255,0.1); color: #fff; outline: none;
        }
        .search-btn {
            padding: 12px 20px; border-radius: 8px; border: none; font-weight: bold;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); cursor: pointer; color: #000;
        }
        .index-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: 0.2s;
        }
        .index-btn:hover { background: #00f2fe; color: #000; }
        .result-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 15px; margin: 15px 0; text-align: left;
        }
        
        /* SETTLEMENT CART STYLES */
        #fleet-cart {
            position: fixed; right: -400px; top: 0; width: 350px; height: 100vh;
            background: rgba(10, 15, 30, 0.75); backdrop-filter: blur(16px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            padding: 20px; color: white; z-index: 1000; overflow-y: auto;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.6);
        }
        #fleet-cart.open { right: 0; }
        
        #cart-toggle {
            position: fixed; bottom: 40px; right: 40px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; 
            width: 65px; height: 65px; color: white; font-size: 24px; 
            cursor: pointer; z-index: 1001; box-shadow: 0 8px 25px rgba(0, 242, 254, 0.5);
            transition: transform 0.2s;
        }
        #cart-toggle:hover { transform: scale(1.1); }
        
        .cart-badge {
            position: absolute; top: -5px; right: -5px;
            background: #ff0055; color: white; font-size: 12px; font-weight: bold;
            border-radius: 50%; width: 24px; height: 24px; 
            display: flex; align-items: center; justify-content: center;
        }
        
        .cart-item {
            background: rgba(255, 255, 255, 0.05); padding: 12px; margin-bottom: 12px;
            border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .action-btn {
            background: rgba(0, 242, 254, 0.1); border: 1px solid #00f2fe;
            color: #00f2fe; padding: 6px 12px; border-radius: 4px; 
            cursor: pointer; font-weight: bold; transition: all 0.2s;
            margin-top: 10px; width: 100%;
        }
        .action-btn:hover { background: #00f2fe; color: #000; }
        
        .init-btn {
            width: 100%; padding: 15px; margin-top: 20px; 
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); 
            border: none; border-radius: 6px; color: #000; font-weight: 900; 
            cursor: pointer; letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-panel">
            <h1>Owo-Nexus AI</h1>
            <p>Welcome to the Sovereign Hub. I am currently monitoring 15,300 active nodes across the Tri-Sector Demand Matrix.</p>
            <div>
                <input type="text" id="searchInput" placeholder="Search for 'Corporate', 'Grid', 'Invisible'...">
                <button class="search-btn" onclick="executeSearch()">SEARCH</button>
            </div>
            
            <!-- ALPHABETICAL INDEX BAR -->
            <div id="index-bar" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; justify-content: center;">
                <button class="index-btn" onclick="filterByIndex('A')">A</button>
                <button class="index-btn" onclick="filterByIndex('C')">C</button>
                <button class="index-btn" onclick="filterByIndex('G')">G</button>
                <button class="index-btn" onclick="filterByIndex('I')">I</button>
                <button class="index-btn" onclick="filterByIndex('M')">M</button>
                <button class="index-btn" onclick="filterByIndex('S')">S</button>
                <button class="index-btn" onclick="filterByIndex('U')">U</button>
                <button class="index-btn" style="background: rgba(255,255,255,0.2); font-weight: bold;" onclick="filterByIndex('ALL')">View All</button>
            </div>
        </div>

        <div id="results" style="margin-top: 20px;"></div>
    </div>

    <!-- SETTLEMENT CART UI -->
    <button id="cart-toggle" onclick="document.getElementById('fleet-cart').classList.toggle('open')">
    🛒<div class="cart-badge" id="cart-count">0</div>
    </button>

    <div id="fleet-cart">
        <h2 style="margin-top:0;">Deployment Fleet</h2>
        <p style="font-size: 12px; color: #aaa;">Selected architectures ready for smart-contract settlement.</p>
        <hr style="border-color: rgba(255,255,255,0.1); margin-bottom: 20px;">
        
        <div id="cart-items"></div>
        
        <button class="init-btn">INITIALIZE SETTLEMENT</button>
    </div>

    <script>
        window.masterLedgerData = [];
        let deploymentFleet = [];

        // CACHE BUSTER ACTIVE
        fetch('hydra_ledger.json?v=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                window.masterLedgerData = data;
            })
            .catch(err => console.error("Error loading registry:", err));

        function renderResults(nodes) {
            const container = document.getElementById('results');
            container.innerHTML = '';
            
            if (nodes.length === 0) {
                container.innerHTML = '<p>No matching nodes found. Try adjusting parameters.</p>';
                return;
            }

            nodes.forEach(node => {
                container.innerHTML += `
                    <div class="result-card">
                        <h3 style="margin: 0 0 10px 0; color: #00f2fe;">${node.id} - ${node.environment}</h3>
                        <p style="margin: 0 0 5px 0; font-weight: bold;">${node.name}</p>
                        <p style="margin: 0 0 10px 0; font-size: 12px; color: #aaa;">Pointer: ${node.smart_contract_pointer}</p>
                        <button class="action-btn" onclick="toggleFleet('${node.id}', '${node.name}', '${node.smart_contract_pointer}')">ADD TO FLEET</button>
                    </div>
                `;
            });
        }

        function executeSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!window.masterLedgerData) return;
            
            const filtered = window.masterLedgerData.filter(node => 
                node.environment.toLowerCase().includes(query) || 
                node.name.toLowerCase().includes(query) ||
                node.id.toLowerCase().includes(query)
            ).slice(0, 50); 
            
            renderResults(filtered);
        }

        function filterByIndex(letter) {
            if (!window.masterLedgerData) return; 
            
            let filtered;
            if (letter === 'ALL') {
                filtered = window.masterLedgerData.slice(0, 50); 
            } else {
                filtered = window.masterLedgerData.filter(node => 
                    node.environment.toUpperCase().startsWith(letter) || 
                    node.name.toUpperCase().startsWith(letter)
                ).slice(0, 50);
            }
            
            renderResults(filtered);
        }

        function toggleFleet(id, name, pointer) {
            const exists = deploymentFleet.findIndex(n => n.id === id);
            if (exists > -1) {
                deploymentFleet.splice(exists, 1); 
            } else {
                deploymentFleet.push({id, name, pointer}); 
            }
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = deploymentFleet.length;
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            
            deploymentFleet.forEach(node => {
                container.innerHTML += `
                <div class="cart-item">
                    <div style="font-size: 11px; color: #00f2fe; letter-spacing: 1px;">${node.id}</div>
                    <div style="font-size: 14px; font-weight: bold; margin: 5px 0;">${node.name}</div>
                    <div style="font-size: 10px; color: #888; word-break: break-all;">${node.pointer}</div>
                    <button onclick="toggleFleet('${node.id}', '${node.name}', '${node.pointer}')" style="margin-top:8px; background:rgba(255,0,85,0.2); color:#ff0055; border:1px solid #ff0055; padding:4px 8px; cursor:pointer; border-radius:4px; font-size:11px; width:100%;">Remove Node</button>
                </div>
                `;
            });
        }
    </script>
</body>
</html>
