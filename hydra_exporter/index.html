<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra Factory OS | Sovereign Storefront</title>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #0a0a0a; color: #00ffcc; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #00ffcc; padding-bottom: 10px; margin-bottom: 20px; }
        #search-bar { width: 100%; max-width: 500px; padding: 10px; background: #111; border: 1px solid #00ffcc; color: #fff; font-size: 16px; margin-bottom: 20px; }
        #cart-panel { background: #111; border: 1px dashed #00ffcc; padding: 15px; margin-bottom: 20px; display: none; }
        .pay-btn { background: #00ffcc; color: #000; padding: 12px 24px; border: none; cursor: pointer; font-weight: bold; width: 100%; max-width: 300px; margin-top: 10px;}
        .pay-btn:hover { background: #fff; }
        #results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .node-card { background: #111; border: 1px solid #333; padding: 15px; transition: 0.3s; }
        .node-card:hover { border-color: #00ffcc; }
        .node-tag { background: #333; padding: 3px 8px; font-size: 12px; margin-right: 5px; color: #fff; }
        .procure-btn { margin-top: 10px; background: #222; color: #00ffcc; border: 1px solid #00ffcc; padding: 8px; width: 100%; cursor: pointer; }
        .procure-btn:hover { background: #00ffcc; color: #000; }
    </style>
</head>
<body>
    <header>
        <h1>HYDRA // FACTORY OS</h1>
        <div style="text-align: right;">
            <span id="cart-total" style="font-size: 18px; margin-right: 15px;">Total: ₦0</span>
            <button class="pay-btn" style="width: auto; padding: 10px;" onclick="toggleCart()">Procure Cart (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <div id="cart-panel">
        <h2>Active Ledger Queue</h2>
        <ul id="cart-list" style="list-style-type: square; margin-bottom: 15px;"></ul>
        <input type="email" id="buyer-email" placeholder="Enter target email for artifact delivery..." style="width: 100%; max-width: 400px; padding: 10px; margin-bottom: 10px; background: #000; color: #00ffcc; border: 1px solid #333;" required />
        <br>
        <button class="pay-btn" onclick="initiatePaystack()">Execute Settlement via Paystack</button>
    </div>

    <input type="text" id="search-bar" placeholder="Search 15,300 Nodes by ID, Environment, or Keyword..." />

    <div id="results-grid"></div>

    <script src="app.js"></script>
</body>
</html>
